      comments:
        comment:
        - '#text': <p>Ok we have delay task... So we have to eat the returned Future.
            Let me change to use ListenableFuture...</p>
          '@author': apache9
          '@created': Wed, 13 Feb 2019 12:03:41 +0000
          '@id': '16767089'
        - '#text': <p>Oh we use the TimeoutExecutor to schedule the delayed task...
            Let me see...</p>
          '@author': apache9
          '@created': Wed, 13 Feb 2019 12:09:06 +0000
          '@id': '16767096'
        - '#text': '<p>Change to use execute. And add a UT to confirm that the UncaughtExceptionHandler
            will be called, in this patch I just abort master if there are uncaught
            exceptions, maybe it is too aggressive?</p>


            <p>Ping <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=stack"
            class="user-hover" rel="stack">stack</a> <a href="https://issues.apache.org/jira/secure/ViewProfile.jspa?name=sershe"
            class="user-hover" rel="sershe">sershe</a>.</p>


            <p>Thanks.</p>'
          '@author': apache9
          '@created': Wed, 13 Feb 2019 12:41:08 +0000
          '@id': '16767138'
        - '#text': '<p>Review board link:</p>


            <p><a href="https://reviews.apache.org/r/69973/" class="external-link"
            target="_blank" rel="nofollow noopener">https://reviews.apache.org/r/69973/</a></p>'
          '@author': apache9
          '@created': Wed, 13 Feb 2019 12:45:35 +0000
          '@id': '16767144'
        - '#text': <p>Patch is good. I did not know that submit bypassed the inserted
            handler. Good find. Aborting the Master is too aggressive I think though
            it might be good to have it in Master for a while at least. We'll start
            to see exceptions that used to be suppressed after this change.</p>
          '@author': stack
          '@created': Wed, 13 Feb 2019 15:42:52 +0000
          '@id': '16767320'
