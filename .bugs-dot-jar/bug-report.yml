      description: '<p>setSmall(boolean small) takes a boolean param and it might
        get called with false also. But with out considering that, we set read type
        as PREAD.  <br/>

        Phoenix clones Scan object and do <br/>

        newScan.setSmall(scan.isSmall());<br/>

        So this makes ALL types of scans from phoenix as PREAD type now. (Even full
        table scan)</p>'
