        - '#text': '<p>Providing my 2 cents here. I have some concerns about "master.abort()"
            call too. Skimming current code on master, we only do this kind of operation
            in 3 places. One is in RegionStateStore when region location cannot be
            updated.<br/>

            Other two are in ActiveMasterManager when master node change cannot be
            handled or master state transition has issue. Those cases are legit to
            abort master because there are issues with master itself.<br/>

            But in this case here, it''s more about remote region server cannot handle
            procedures for an unknown reason.  It''s not optimal, but I don''t see
            it''s critical enough to abort master. </p>'
          '@author': xucang
          '@created': Wed, 13 Feb 2019 20:02:26 +0000
          '@id': '16767541'
        - '#text': <p>Thanks guys. Removed the abort call, just log an error. And
            fixed the javadoc issue. The error prone warnings are not introduced by
            this patch.</p>
          '@author': apache9
          '@created': Thu, 14 Feb 2019 00:34:28 +0000
          '@id': '16767737'
