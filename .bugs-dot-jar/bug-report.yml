      description: '<p>Found this when implementing <a href="https://issues.apache.org/jira/browse/HBASE-21875"
        title="Change the retry logic in RSProcedureDispatcher to &#39;retry by default,
        only if xxx&#39;" class="issue-link" data-issue-key="HBASE-21875"><del>HBASE-21875</del></a>,
        the UncaughtExceptionHandler will not be invoked if you use submit to submit
        the task, as by design, you should use the returned Future object to get the
        result(exception).</p>


        <p>As we do not care the return value here, let''s change to use execute method.</p>'
